name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 单元测试
        run: python -m unittest discover -s tests -v

  # "零第三方依赖"是项目的承诺，这里守一道门
  no-third-party:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 只允许标准库
        run: python tools/check_stdlib.py

  # pyproject 里配了 ruff / mypy，必须真的跑，否则配置只是摆设
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装检查工具（仅 CI 使用，不是运行时依赖）
        run: pip install "ruff==0.17.3" "mypy==2.4.1"
      - name: ruff
        run: python -m ruff check .
      - name: mypy
        run: python -m mypy
