name: Vigil

on:
  # 注意：public 仓库的定时任务在 60 天无提交活动后会被 GitHub 自动停用。
  # 每两个月来 Actions 页面点一次 Run workflow，或随便提交一次即可恢复。
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vuln-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 恢复上一轮的基线
        uses: actions/cache@v4
        with:
          path: state.json
          key: vuln-state-${{ github.run_id }}
          restore-keys: |
            vuln-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉一轮并推送
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python watch.py
